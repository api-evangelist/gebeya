aid: gebeya
name: Gebeya
description: 'Gebeya is an Ethiopian talent-cloud and marketplace technology company headquartered
  in Addis Ababa, founded in 2016 by Amadou Daffe and Hiruy Amanuel. It trains, vets, and connects
  African tech talent with organizations, and provides a Marketplace-as-a-Service platform (Gebeya-Jenga)
  that lets entrepreneurs launch branded, multi-tenant service marketplaces with built-in payments
  and analytics. Its current products include Dala Studio and Jitume, applying LLMs and proprietary
  data to build AI agents and workforce-intelligence tools for the African digital economy. Gebeya
  is backed by Partech. As of this profiling it publishes no public developer API, OpenAPI
  specification, or SDK.'
